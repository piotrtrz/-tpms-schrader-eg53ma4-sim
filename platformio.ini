; PlatformIO - symulator czujnikow TPMS Schrader EG53MA4 (ESP32 + CC1101)
;
; Kompilacja:   pio run -e esp32c3supermini
; Testy:       pio test -e native
; Upload:      pio run -e esp32c3supermini -t upload
; Monitor:     pio device monitor
;
; Zastrzezenie: projekt diagnostyczny/testowy - symulator generuje
; sztuczne dane cisnienia, nie zastepuje prawdziwych czujnikow TPMS.

[platformio]
default_envs = esp32c3supermini

[env:esp32c3supermini]
; Wersje przypiete do zweryfikowanego buildu (espressif32 8.0.0,
; SmartRC-CC1101-Driver-Lib 3.0.2 = commit de6757e)
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Biblioteka CC1101 (ELECHOUSE_CC1101_SRC_DRV / SmartRC):
; wymagana wersja >= 2.5.7 (wspolne API setSpiPin/setGDO0 dla 2.5.x i 3.x).
lib_deps =
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git#de6757ef633b3e626dae5c7835cdb66ab53f9a1d
build_flags =
    -Wall
    -Wextra
    -Werror
    ; Natywny USB-C SuperMini: konsola Serial i programowanie bez mostka UART.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:native]
; Przenosna logika: ramka, NVS i maszyna stanow (PIN_ACC wlaczony w testach).
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Werror -DPIN_ACC=2
build_src_filter = -<*> +<tpms_frame.cpp> +<settings.cpp> +<app_state.cpp>
test_build_src = true
test_framework = unity
