; PlatformIO - Schrader EG53MA4 TPMS sensor simulator (ESP32 + CC1101)
;
; Build:      pio run -e esp32s2mini
; Tests:      pio test -e native
; Upload:     pio run -e esp32s2mini -t upload
; Monitor:    pio device monitor
;
; Disclaimer: diagnostic/test project - the simulator generates
; synthetic pressure data and does not replace real TPMS sensors.

[platformio]
default_envs = esp32s2mini

[env:esp32s2mini]
; Versions pinned to the verified build (espressif32 8.0.0,
; SmartRC-CC1101-Driver-Lib 3.0.2 = commit de6757e)
platform = espressif32@8.0.0
; ESP32-S2-MINI (ESP32-S2FN4R2, e.g. ARD-ESP32-S2-MINI): a Lolin/Wemos
; S2 Mini type board; sold with MicroPython, we flash our own firmware.
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
; CC1101 library (ELECHOUSE_CC1101_SRC_DRV / SmartRC):
; version >= 2.5.7 required (shared setSpiPin/setGDO0 API for 2.5.x and 3.x).
lib_deps =
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git#de6757ef633b3e626dae5c7835cdb66ab53f9a1d
build_flags =
    -Wall
    -Wextra
    -Werror
    ; Native ESP32-S2 USB: Serial console and flashing without a UART bridge.
    ; ARDUINO_USB_MODE remains the default for lolin_s2_mini (=0).
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
; Portable logic: frame, NVS, console parsing and the state machine
; (PIN_ACC enabled in tests).
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Werror -DPIN_ACC=2
build_src_filter = -<*> +<tpms_frame.cpp> +<settings.cpp> +<app_state.cpp> +<parse.cpp>
test_build_src = true
test_framework = unity
