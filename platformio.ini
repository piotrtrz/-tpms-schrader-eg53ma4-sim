; PlatformIO - symulator czujnikow TPMS Schrader EG53MA4 (ESP32 + CC1101)
;
; Kompilacja:   pio run -e esp32dev
; Testy:       pio test -e native
; Upload:      pio run -e esp32dev -t upload
; Monitor:     pio device monitor
;
; Zastrzezenie: projekt diagnostyczny/testowy - symulator generuje
; sztuczne dane cisnienia, nie zastepuje prawdziwych czujnikow TPMS.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Biblioteka CC1101 (ELECHOUSE_CC1101_SRC_DRV / SmartRC):
; wersja 3.x udostepnia naglowek zgodnosciowy ELECHOUSE_CC1101_SRC_DRV.h,
; kod obsluguje tez API 1.x/2.x (patrz src/radio.cpp).
lib_deps =
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
build_flags =
    -Wall
    -Wextra

[env:native]
; Testy jednostkowe generatora ramek (bez sprzetu)
platform = native
build_flags = -std=gnu++17 -Wall
build_src_filter = -<*> +<tpms_frame.cpp>
test_build_src = true
test_framework = unity
