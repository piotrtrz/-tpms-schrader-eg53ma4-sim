name: check
on:
  push:
    branches: [main, feat/release-v2]
  pull_request:

jobs:
  check-without-hardware:
    runs-on: ubuntu-24.04
    container: python:3.12.12-slim-bookworm
    steps:
      # nodejs jest potrzebne akcjom JS (checkout, upload-artifact) i musi być
      # zainstalowane przed pierwszym krokiem "uses".
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git libusb-1.0-0-dev librtlsdr-dev pkg-config ca-certificates nodejs
      - uses: actions/checkout@v4
      - name: Install pinned Python tools
        run: pip install --no-cache-dir --disable-pip-version-check -r tools/requirements.txt
      - name: All tests without hardware
        run: bash ./tools/check_all
      - name: Upload validation reports
        # Oficjalny upload-artifact@v4+ odmawia pracy poza github.com (pozostałe
        # instancje uznaje za GHES), a GITHUB_SERVER_URL z konteksta zadania nadpisuje
        # env kroku, więc obejście przez env nie działa. To fork polecany przez
        # społeczność Gitei: kod oficjalnego v4, w którym jedynie isGhes() zwraca
        # false. Przypięty do commita gałęzi v4 zamiast do pływającej nazwy.
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: validation-reports
          path: artifacts/validation/
