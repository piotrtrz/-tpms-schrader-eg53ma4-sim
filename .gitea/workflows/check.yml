name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-without-hardware:
    runs-on: ubuntu-24.04
    container: python:3.12.12-slim-bookworm
    steps:
      # nodejs is needed by the JS actions (checkout, upload-artifact) and must be
      # installed before the first "uses" step.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git libusb-1.0-0-dev librtlsdr-dev pkg-config ca-certificates nodejs
      - uses: actions/checkout@v4
      - name: Install pinned Python tools
        run: pip install --no-cache-dir --disable-pip-version-check -r tools/requirements.txt
      - name: All tests without hardware
        run: bash ./tools/check_all
      - name: Upload validation reports
        # The official upload-artifact@v4+ refuses to run outside github.com
        # (other instances are treated as GHES), and GITHUB_SERVER_URL from the
        # job context overrides the step env, so the env workaround does not
        # work. This is a fork recommended by the Gitea community: the official
        # v4 code with only isGhes() returning false. Pinned to a commit of the
        # v4 branch instead of a floating ref.
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: validation-reports
          path: artifacts/validation/
