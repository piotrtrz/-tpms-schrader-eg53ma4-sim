name: check
on:
  push:
    branches: [main, feat/release-v2]
  pull_request:

jobs:
  check-without-hardware:
    runs-on: docker
    container: python:3.12.12-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git libusb-1.0-0-dev pkg-config ca-certificates
      - name: Install pinned Python tools
        run: pip install --no-cache-dir --disable-pip-version-check -r tools/requirements.txt
      - name: All tests without hardware
        run: bash ./tools/check_all
      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: artifacts/validation/
